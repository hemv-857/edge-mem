<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 30" width="30" height="30" role="img" aria-label="EDGE.MEM">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d1d21"/>
      <stop offset="1" stop-color="#131316"/>
    </linearGradient>
    <style>
      .em-bar { fill: #e4e4e7; }
      .em-link, .em-node { fill: #10b981; }
      .em-pulse { animation: emPulse 2.6s ease-in-out infinite; transform-origin: 23px 15px; }
      @keyframes emPulse {
        0%, 100% { opacity: 0.75; transform: scale(0.94); }
        50% { opacity: 1; transform: scale(1); }
      }
    </style>
  </defs>

  <!-- tile -->
  <rect x="0.75" y="0.75" width="28.5" height="28.5" rx="7.5" fill="url(#tile)" stroke="#3f3f46" stroke-width="1.5"/>

  <!-- memory layers (E) -->
  <g class="em-bar">
    <rect x="7" y="8" width="16" height="3.2" rx="1.6"/>
    <rect x="7" y="13.4" width="8.5" height="3.2" rx="1.6"/>
    <rect x="7" y="18.8" width="16" height="3.2" rx="1.6"/>
  </g>

  <!-- edge link + node -->
  <rect class="em-link" x="15" y="14.3" width="5.5" height="1.4" rx="0.7"/>
  <circle class="em-node em-pulse" cx="23" cy="15" r="2.7"/>
</svg>
