# Render blueprint for the edge-engine (Python service).
# Dashboard → New → Blueprint → pick this repo; Render reads this file.
#
# The Next.js frontend deploys separately on Vercel. After both are up:
#   1. copy this service's URL into Vercel env EDGE_URL
#   2. copy EDGE_TOKEN (generated below) into Vercel env EDGE_TOKEN
#   3. custom domain? add it to Vercel env EDGE_ALLOWED_HOSTS (host guard)
services:
  - type: web
    name: edge-mem-engine
    runtime: python
    plan: free # engine + peer + qdrant measure ~95MB, fits 512MB
    repo: https://github.com/hemv-857/edge-mem
    branch: main
    # EDGE_WARMUP caches qdrant + models at build time (disk persists to runtime)
    buildCommand: pip install -r mini-services/edge-engine/requirements.txt && EDGE_WARMUP=1 bash mini-services/edge-engine/start.sh
    startCommand: bash mini-services/edge-engine/start.sh
    healthCheckPath: /api/edge/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      - key: EDGE_TOKEN
        generateValue: true
